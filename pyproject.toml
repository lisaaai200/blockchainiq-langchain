[project]
name = "blockchainiq-langchain"
version = "0.1.0"
description = "LangChain tools for Blockchain IQ's pay-per-call crypto data API, paid with x402 (USDC on Base)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["langchain-core>=0.3", "eth-account>=0.10", "requests>=2.31", "pydantic>=2"]

[project.optional-dependencies]
test = ["pytest>=7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["blockchainiq_langchain"]
